name: 'Sequential release'
description: 'Record a release in Sequential: its version, its merged pull requests and the findings they fix.'
branding:
  icon: 'tag'
  color: 'purple'

inputs:
  version:
    description: 'The release version (a tag, build number, or any string up to 64 characters).'
    required: true
  environment:
    description: 'The environment label (e.g. production, staging). Defaults to the project setting.'
    required: false
  sha:
    description: 'The commit SHA this release points at.'
    required: false
  released-at:
    description: 'When the release went live: an ISO date-time with a timezone (e.g. github.event.deployment_status.created_at). Default: now.'
    required: false
  title:
    description: 'A short title for the release (up to 120 characters).'
    required: false
  range:
    description: >
      A git revision range (e.g. v1.2.0..HEAD) to scan for `Sequential-Finding: F-12` commit
      trailers. Requires the checkout step to have fetched enough history (see README). Not with
      github-changes.
    required: false
  github-changes:
    description: >
      'true' to read the release's merged pull requests (as changes) and the findings they close from the GitHub API,
      with no checkout. Needs `sha`, and the job permissions deployments: read, contents: read, pull-requests: read.
    required: false
    default: 'false'
  base:
    description: >
      With github-changes: the previous release's commit, or 'auto' (default): on a deployment_status event, the newest
      earlier successful deployment in the same GitHub environment; on a push, the push's `before`.
    required: false
    default: 'auto'
  project-key:
    description: >
      This Sequential project's key, for repositories that deploy several projects: only "Fixes <key>#F-12" (and
      `Sequential-Finding: <key>#F-12`) name findings of this release. Unqualified "Fixes F-12" then counts only with
      findings: all.
    required: false
  findings:
    description: "Which ids count: 'all' (unqualified ids too; the default without project-key) or 'qualified' (the default with project-key)."
    required: false
  github-token:
    description: 'The token for the GitHub API reads (github-changes). Default: the workflow token.'
    required: false
    default: ${{ github.token }}
  token:
    description: >
      A Sequential personal access token (sq_pat_…) with the releases:write scope, made for one project (the release
      goes to that project). Passed to the CLI as SEQUENTIAL_RELEASES_TOKEN. Pass this from a secret
      (e.g. ${{ secrets.SEQUENTIAL_RELEASES_TOKEN }}), never as a literal value.
    required: true
  api-url:
    description: >
      The Sequential API. Default: Sequential's hosted API, https://api.usesequential.com. Set it only for a
      self-hosted deployment (https).
    required: false

runs:
  using: 'composite'
  steps:
    - name: Record the release
      shell: bash
      env:
        # Inputs arrive as environment variables, never interpolated into the script below:
        # `${{ inputs.x }}` inside a `run:` string is an injection vector (a malicious `version` or
        # `range` could break out of quoting), so every value crosses this boundary as data.
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_RANGE: ${{ inputs.range }}
        INPUT_RELEASED_AT: ${{ inputs.released-at }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_GITHUB_CHANGES: ${{ inputs.github-changes }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_PROJECT_KEY: ${{ inputs.project-key }}
        INPUT_FINDINGS: ${{ inputs.findings }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SEQUENTIAL_RELEASES_TOKEN: ${{ inputs.token }}
        SEQUENTIAL_API_URL: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        args=(--version "$INPUT_VERSION")
        if [ -n "${INPUT_ENVIRONMENT:-}" ]; then args+=(--environment "$INPUT_ENVIRONMENT"); fi
        if [ -n "${INPUT_SHA:-}" ]; then args+=(--commit-sha "$INPUT_SHA"); fi
        if [ -n "${INPUT_RANGE:-}" ]; then args+=(--range "$INPUT_RANGE"); fi
        if [ -n "${INPUT_RELEASED_AT:-}" ]; then args+=(--released-at "$INPUT_RELEASED_AT"); fi
        if [ -n "${INPUT_TITLE:-}" ]; then args+=(--title "$INPUT_TITLE"); fi
        if [ "${INPUT_GITHUB_CHANGES:-false}" = "true" ]; then args+=(--github-changes --base "${INPUT_BASE:-auto}"); fi
        if [ -n "${INPUT_PROJECT_KEY:-}" ]; then args+=(--project-key "$INPUT_PROJECT_KEY"); fi
        if [ -n "${INPUT_FINDINGS:-}" ]; then args+=(--findings "$INPUT_FINDINGS"); fi
        node "$GITHUB_ACTION_PATH/bin/sequential-release.cjs" "${args[@]}"
